    <title>株検索ツール簡易版</title>

    <script src="../css_js/common.js"></script>
    <link rel="stylesheet" href="../css_js/style.css" type="text/css">
</head>

<body>

<header id="header"></header>    <!-- ヘッダーリンク -->




<main class="container">

<nav class="breadcrumb" aria-label="パンくずリスト">
    <ol>
        <li><a href="../">ホーム</a></li>
        <li>株検索ツール簡易版</li>
    </ol>
</nav>

    <div id="stock-search">
      <h3>株検索ツール簡易版（26/09/07更新）</h3>

      <div>
        <label>
          株価：
          <input type="number" id="maxPrice" value="5000" step="100">
          円以下
        </label>
      </div>

      <div>
        <label>
          配当利回り：
          <input type="number" id="minDividend" value="3" step="0.1">
          %以上
        </label>
      </div>

      <div>
        <label>
          PER：
          <input type="number" id="maxPER" value="15" step="0.1">
          以下
        </label>
      </div>

      <div>
        <label>
          PBR：
          <input type="number" id="maxPBR" value="1" step="0.1">
          以下
        </label>
      </div>

      <br>

      <button id="searchButton" onclick="searchStocks()" disabled>読み込み中...</button>

      <div id="result"></div>

        <p>
            検索結果は投資判断を保証するものではありません。<br>
            実際に投資を行う場合は、企業の業績や財務状況、<br>
            最新のニュースなども確認したうえで、ご自身で判断してください。
        </p>

    </div>
</main>


<footer id="footer"></footer>    <!-- フッターリンク -->
